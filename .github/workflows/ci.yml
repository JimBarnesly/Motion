name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end test
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify local-only application sources
        run: node scripts/check-offline-assets.mjs
      - name: Scan tracked files for common secret formats
        run: node scripts/secret-scan.mjs
      - name: Run benchmark smoke fixture
        run: node scripts/benchmark-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke
          path: artifacts/benchmark-smoke.json
          if-no-files-found: warn
          retention-days: 14

  native-desktop:
    name: Native desktop (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci --ignore-scripts
      - name: Cache pinned Node desktop runtime archive
        uses: actions/cache@v4
        with:
          path: .cache/node-runtime
          key: motion-node-runtime-24.18.0-${{ matrix.arch }}
      - name: Prepare verified bundled Node runtime
        run: npm run runtime:prepare --workspace @motion/desktop
      - name: Build desktop Web assets for Tauri context
        run: npm run build --workspace @motion/web
      - name: Check desktop TypeScript and IPC contract
        run: |
          npm run typecheck --workspace @motion/desktop
          npm run test --workspace @motion/desktop
      - name: Test native shell
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build native Linux packages
        run: npm run tauri:build --workspace @motion/desktop -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: motion-linux-${{ matrix.arch }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*
            apps/desktop/src-tauri/target/release/bundle/appimage/*
          if-no-files-found: error
          retention-days: 14
