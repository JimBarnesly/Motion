name: Release provenance

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to build; defaults to the dispatched revision
        required: false
        type: string

permissions: {}

concurrency:
  group: release-provenance-${{ inputs.commit || github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - id: plan
        name: Resolve immutable release plan
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          test "${#commit}" -eq 40
          version="$(node -p "require('./package.json').version")"
          test -n "$version"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: Build ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Confirm immutable source commit
        run: test "$(git rev-parse HEAD)" = "${{ needs.plan.outputs.commit }}"
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential file libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci --ignore-scripts
      - name: Build AppImage and Debian package
        run: npm run tauri:build --workspace @motion/desktop -- --bundles deb,appimage
      - name: Install pinned fail-closed secret scanner
        run: scripts/install-gitleaks.sh .tools/gitleaks
      - name: Scan packaged text resources
        env:
          GITLEAKS_BIN: ${{ github.workspace }}/.tools/gitleaks
        run: |
          node scripts/secret-scan.mjs \
            --staging apps/desktop/dist \
            --report artifacts/secret-scan/findings-${{ matrix.architecture }}.json
          node scripts/unsafe-default-scan.mjs \
            --staging apps/desktop/dist \
            --report artifacts/secret-scan/unsafe-defaults-${{ matrix.architecture }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-secret-scan-${{ matrix.architecture }}-${{ needs.plan.outputs.commit }}
          path: |
            artifacts/secret-scan/findings-${{ matrix.architecture }}.json
            artifacts/secret-scan/unsafe-defaults-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Stage canonical artifact names
        shell: bash
        run: |
          mkdir -p artifacts/release
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage \
            "artifacts/release/Motion_${{ needs.plan.outputs.version }}_${{ matrix.architecture }}.AppImage"
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb \
            "artifacts/release/Motion_${{ needs.plan.outputs.version }}_${{ matrix.architecture }}.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.architecture }}-${{ needs.plan.outputs.commit }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  provenance:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*-${{ needs.plan.outputs.commit }}
          path: artifacts/release
          merge-multiple: true
      - name: Generate deterministic release manifest
        run: |
          node scripts/release-manifest.mjs \
            --directory artifacts/release \
            --output artifacts/release/release-manifest.json \
            --version "${{ needs.plan.outputs.version }}" \
            --commit "${{ needs.plan.outputs.commit }}" \
            --repository "${{ github.repository }}"
      - name: Install pinned fail-closed secret scanner
        run: scripts/install-gitleaks.sh .tools/gitleaks
      - name: Scan release manifests and packaged text resources before signing
        env:
          GITLEAKS_BIN: ${{ github.workspace }}/.tools/gitleaks
        run: |
          node scripts/secret-scan.mjs \
            --staging artifacts/release \
            --report artifacts/secret-scan/findings.json
          node scripts/unsafe-default-scan.mjs \
            --staging artifacts/release \
            --report artifacts/secret-scan/unsafe-defaults.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-secret-scan-${{ needs.plan.outputs.commit }}
          path: |
            artifacts/secret-scan/findings.json
            artifacts/secret-scan/unsafe-defaults.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify unsigned release structure before signing
        run: |
          node scripts/verify-release-structure.mjs \
            --directory artifacts/release \
            --version "${{ needs.plan.outputs.version }}" \
            --commit "${{ needs.plan.outputs.commit }}" \
            --repository "${{ github.repository }}"
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Sign manifest with GitHub OIDC identity
        run: cosign sign-blob --yes --bundle artifacts/release/release-manifest.sigstore.json artifacts/release/release-manifest.json
      - id: attest
        name: Generate keyless GitHub build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/release/*.AppImage
            artifacts/release/*.deb
      - name: Preserve provenance verification bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" artifacts/release/release-provenance.jsonl
      - name: Verify assembled signed and attested release bundle
        env:
          MOTION_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-provenance.yml@${{ github.ref }}
        run: |
          node scripts/verify-release.mjs \
            --directory artifacts/release \
            --version "${{ needs.plan.outputs.version }}" \
            --commit "${{ needs.plan.outputs.commit }}" \
            --repository "${{ github.repository }}" \
            --certificate-identity "$MOTION_CERTIFICATE_IDENTITY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motion-release-${{ needs.plan.outputs.version }}-${{ needs.plan.outputs.commit }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30
