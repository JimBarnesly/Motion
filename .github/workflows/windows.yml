name: Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 native and installer
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci --ignore-scripts
      - run: npm run test:workflow-script-contracts
      - name: Build existing application and web assets
        run: npm run build
      - name: Prepare checksum-verified Windows runtime
        run: npm run runtime:prepare --workspace @motion/desktop
      - name: Verify Windows package contract
        run: node --test apps/desktop/test/runtime-prepare.test.mjs apps/desktop/test/windows-package.test.mjs scripts/windows-installer-payload.test.mjs
      - name: Compile native Windows application
        run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Test native Windows Rust boundary
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Test Windows filesystem and service behavior
        shell: pwsh
        run: |
          $env:MOTION_NATIVE_HELPER = (Resolve-Path apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/debug/motion-desktop.exe).Path
          node --test apps/desktop/test/windows/*.test.mjs packages/storage/dist/test/windows/*.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test apps/desktop/test/service-start-gate.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build offline per-user Windows installer
        run: npm run tauri:build --workspace @motion/desktop -- --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Install and test the actual packaged application
        id: installed_acceptance
        shell: pwsh
        run: ./scripts/windows-installed-acceptance.ps1
      - name: Upload verified-payload Windows candidate and acceptance evidence
        if: ${{ always() && steps.installed_acceptance.outputs.installer_payload_verified == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: motion-windows-x64-candidate
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            artifacts/windows-acceptance/**
          if-no-files-found: error
          retention-days: 14
      - name: Retain Windows acceptance and prerequisite diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: motion-windows-x64-evidence
          path: artifacts/windows-acceptance/**
          if-no-files-found: warn
          retention-days: 14
