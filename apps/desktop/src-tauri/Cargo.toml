[package]
name = "motion-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rfd = "0.17.2"
libc = "=0.2.189"
rustix = { version = "=1.1.4", features = ["process"] }

[lib]
name = "motion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
