<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Motion</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <header class="brand-row">
          <button class="brand" id="homeButton" type="button" aria-label="Open workspace home">
            <span class="brand-mark" aria-hidden="true">M</span><span>Motion</span>
          </button>
          <button class="icon-button mobile-only" id="closeSidebar" type="button" aria-label="Close navigation">×</button>
        </header>
        <button class="search-button" id="openSearch" type="button"><span aria-hidden="true">⌕</span> Search <kbd>Ctrl K</kbd></button>
        <nav id="favouritesNav" aria-label="Favourite pages" hidden>
          <div class="nav-heading"><span>Favourites</span></div>
          <div id="favouritesList" class="page-tree"></div>
        </nav>
        <nav aria-label="Workspace pages">
          <div class="nav-heading"><span>Pages</span><span><button class="icon-button" id="addRootDatabase" type="button" aria-label="New table">▦</button><button class="icon-button" id="addRootPage" type="button" aria-label="Add page">+</button></span></div>
          <div id="pageTree" class="page-tree"></div>
        </nav>
        <nav aria-label="Trash">
          <div class="nav-heading"><span>Trash</span></div>
          <div id="trashList" class="page-tree"></div>
        </nav>
        <footer class="sidebar-footer">
          <div><span class="status-dot" aria-hidden="true"></span> Local workspace</div>
          <details class="workspace-tools">
            <summary>Workspace tools</summary>
            <div class="backup-actions">
              <button id="exportWorkspace" type="button">Export JSON</button>
              <button id="restoreWorkspace" type="button">Restore</button>
              <input id="restoreFile" type="file" accept="application/json,.json" hidden />
              <button id="attachFile" type="button">Attach file</button>
              <input id="attachmentFile" type="file" hidden />
              <button id="createVerifiedBackup" type="button">Verified backup</button>
              <button id="restoreVerifiedBackup" type="button">Restore verified</button>
              <input id="verifiedBackupFile" type="file" accept="application/json,.json" hidden />
            </div>
          </details>
        </footer>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-button mobile-only" id="openSidebar" type="button" aria-label="Open navigation">☰</button>
          <div id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></div>
          <button class="icon-button context-toggle" id="openContext" aria-controls="contextPanel" aria-expanded="false" type="button">Links &amp; files</button>
          <span class="save-state" id="saveState" role="status">Saved locally</span>
        </header>
        <section id="editRecovery" class="edit-recovery" role="alert" aria-live="assertive" aria-atomic="true" hidden>
          <div><strong id="editRecoveryMessage">An edit could not be saved.</strong><span>The exact edit is still shown but is not saved.</span></div>
          <div class="edit-recovery-actions">
            <button id="retryEdit" type="button">Retry save</button>
            <button id="discardEdit" type="button">Discard unsaved changes</button>
          </div>
        </section>
        <section class="content" id="content" aria-live="polite"></section>
      </main>

      <aside class="context-panel" id="contextPanel" aria-label="Page context">
        <div class="context-heading"><h2 id="contextPanelTitle" tabindex="-1">Links &amp; files</h2><span><button class="quiet" id="copyPageLink" type="button" hidden>Copy page link</button><button class="icon-button context-close" id="closeContext" type="button" aria-label="Close links and files">×</button></span></div>
        <section><h3>Linked pages</h3><div id="outgoingLinks"></div></section>
        <section><h3>Backlinks</h3><div id="backlinks"></div></section>
        <section><h3>Workspace attachments</h3><div id="attachments" aria-live="polite"></div></section>
      </aside>
    </div>

    <dialog id="searchDialog" class="search-dialog">
      <form method="dialog" class="dialog-card">
        <div class="search-input-row"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" autocomplete="off" placeholder="Search pages and blocks…" aria-label="Search workspace" /><button value="cancel" class="key-button" aria-label="Close search">Esc</button></div>
        <div id="searchResults" class="search-results" role="status" aria-live="polite"></div>
      </form>
    </dialog>
    <div id="mentionChooser" class="mention-chooser" role="listbox" aria-label="Page mentions" hidden></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
